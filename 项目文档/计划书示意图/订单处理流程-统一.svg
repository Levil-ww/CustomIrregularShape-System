<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680"><rect width="1000" height="680" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#df7c29"/></marker></defs><style>text{font-family:Microsoft YaHei,sans-serif;fill:#18354d;font-size:18px}.title{font-size:24px;font-weight:bold}.box{fill:#e8f3fa;stroke:#24709c;stroke-width:2}.link{fill:none;stroke:#df7c29;stroke-width:2;marker-end:url(#arrow)}</style><text class="title" x="450" y="38" text-anchor="middle">订单处理流程</text><rect class="box" x="190" y="65" width="520" height="48" rx="10"/><text x="450.0" y="95.0" text-anchor="middle">选择形状模块</text><path class="link" d="M450 113 L450 130"/><rect class="box" x="190" y="130" width="520" height="48" rx="10"/><text x="450.0" y="160.0" text-anchor="middle">输入订单名称与尺寸</text><path class="link" d="M450 178 L450 195"/><rect class="box" x="190" y="195" width="520" height="48" rx="10"/><text x="450.0" y="225.0" text-anchor="middle">草图识别或人工输入</text><path class="link" d="M450 243 L450 260"/><rect class="box" x="190" y="260" width="520" height="48" rx="10"/><text x="450.0" y="290.0" text-anchor="middle">核对尺寸和补偿</text><path class="link" d="M450 308 L450 325"/><rect class="box" x="190" y="325" width="520" height="48" rx="10"/><text x="450.0" y="355.0" text-anchor="middle">选择图库或指定素材</text><path class="link" d="M450 373 L450 390"/><rect class="box" x="190" y="390" width="520" height="48" rx="10"/><text x="450.0" y="420.0" text-anchor="middle">匹配素材并分析结构</text><path class="link" d="M450 438 L450 455"/><rect class="box" x="190" y="455" width="520" height="48" rx="10"/><text x="450.0" y="485.0" text-anchor="middle">计算轮廓并排版</text><path class="link" d="M450 503 L450 520"/><rect class="box" x="190" y="520" width="520" height="48" rx="10"/><text x="450.0" y="550.0" text-anchor="middle">预览、核对与调整</text><path class="link" d="M450 568 L450 585"/><rect class="box"