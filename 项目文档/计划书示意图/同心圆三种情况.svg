<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470"><rect width="1080" height="470" fill="white"/><style>text{font-family:Microsoft YaHei,sans-serif;fill:#18354d;font-size:18px}.title{font-size:23px;font-weight:bold}.outer{fill:#e8f3fa;stroke:#24709c;stroke-width:3}.inner{fill:#b9dcef;stroke:#df7c29;stroke-width:2}.gap{fill:white;stroke:#99aebb;stroke-width:1}</style><text class="title" x="180" y="42" text-anchor="middle">无间隙</text><circle class="outer" cx="180" cy="180" r="130"/><circle class="gap" cx="180" cy="180" r="76"/><circle class="inner" cx="180" cy="180" r="76"/><text x="180" y="350" text-anchor="middle">内圆成品直径：56 cm</text><text x="180" y="381" text-anchor="middle">空洞直径：56 cm</text><text x="180" y="412" text-anchor="middle">单边间隙：0 cm</text><text class="title" x="540" y="42" text-anchor="middle">间隙向外</text><circle class="outer" cx="540" cy="180" r="130"/><circle class="gap" cx="540" cy="180" r="82"/><circle class="inner" cx="540" cy="180" r="76"/><text x="540" y="350" text-anchor="middle">内圆成品直径：56 cm</text><text x="540" y="381" text-anchor="middle">空洞直径：60 cm</text><text x="540" y="412" text-anchor="middle">单边间隙：2 cm</text><text class="title" x="900" y="42" text-anchor="middle">间隙向内</text><circle class="outer" cx="900" cy="180" r="130"/><circle class="gap" cx="900" cy="180" r="76"/><circle class="inner" cx="900" cy="180" r="70"/><text x="900" y="350" text-anchor="middle">内圆成品直径：52 cm</text><text x="900" y="381" text-anchor="middle">空洞直径：56 cm</text><text x="900" y="412" text-anchor="middle">单边间隙：2 cm</text><text x="540" y="453" text-anchor="middle">输入内圆所需直径 55 cm，补偿 1 cm；同一外圆比例示意，白色为径向间隙</text></svg>